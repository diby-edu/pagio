# Transmission au conteneur Pagio (127.0.0.1:8787). À copier dans /etc/nginx/snippets/pagio-proxy.conf.
proxy_pass http://127.0.0.1:8787;
proxy_http_version 1.1;
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
# Fichiers à convertir (100 Mo au plus) ; une conversion LibreOffice ou une réponse de l'IA peut dépasser une minute.
client_max_body_size 110m;
proxy_read_timeout 300s;
proxy_send_timeout 300s;
