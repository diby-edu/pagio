# Pagio : serveur + tableau de bord, dans un conteneur Docker joignable sur 127.0.0.1:8787 seulement.
# À placer dans /etc/nginx/sites-available/pagio (lien dans sites-enabled), puis :
#   nginx -t && systemctl reload nginx && certbot --nginx -d pagio.hebergementci.com
# Certbot ajoute ensuite lui-même les lignes HTTPS à ce fichier.
server {
    listen 80;
    listen [::]:80;
    server_name pagio.hebergementci.com;

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Fichiers à convertir (50 Mo au plus, réglable dans le tableau de bord) et import de sauvegarde.
        client_max_body_size 60m;
        # Une conversion LibreOffice ou une réponse de l'IA peut prendre plus d'une minute.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
