# Adresses publiques (pagio.site, www.pagio.site, pagio.hebergementci.com) : API de l'application et pages des liens
# envoyés par e-mail. Le tableau de bord et /api/admin n'y existent pas : ils sont seulement sur admin.pagio.site,
# pour les appareils autorisés. À copier dans /etc/nginx/snippets/pagio-public.conf.

# Insensible à la casse et aux « / » répétés : le serveur Node accepte /api/ADMIN/... comme /api/admin/...
location ~* ^/api/+admin { return 404; }

location /api/ {
    include /etc/nginx/snippets/pagio-proxy.conf;
}

# Liens « mot de passe oublié » et « confirmer mon adresse ».
location = /reinitialiser { include /etc/nginx/snippets/pagio-proxy.conf; }
location = /verifier      { include /etc/nginx/snippets/pagio-proxy.conf; }

# APK à télécharger directement (hors Google Play) : type reconnu par Android, enregistrée sous le nom pagio.apk.
location /telecharger/ {
    root /var/www/pagio/site;
    types { application/vnd.android.package-archive apk; }
    add_header Content-Disposition 'attachment; filename="pagio.apk"' always;
    add_header Cache-Control "no-cache" always;
}

# Site public (fichiers statiques).
location / {
    root /var/www/pagio/site;
    try_files $uri $uri/ =404;
}
