# Adresses publiques (pagio.site, www.pagio.site, pagio.hebergementci.com) : API de l'application et pages des liens
# envoyés par e-mail. Le tableau de bord et /api/admin n'y existent pas : ils sont seulement sur admin.pagio.site,
# pour les appareils autorisés. À copier dans /etc/nginx/snippets/pagio-public.conf.

# Insensible à la casse et aux « / » répétés : le serveur Node accepte /api/ADMIN/... comme /api/admin/...
location ~* ^/api/+admin { return 404; }

location /api/ {
    include /etc/nginx/snippets/pagio-proxy.conf;
}

# Liens « mot de passe oublié » et « confirmer mon adresse ».
location = /reinitialiser { include /etc/nginx/snippets/pagio-proxy.conf; }
location = /verifier      { include /etc/nginx/snippets/pagio-proxy.conf; }

# APK à télécharger directement (hors Google Play) : type reconnu par Android, enregistrée sous le nom pagio.apk.
location /telecharger/ {
    root /var/www/pagio/site;
    types { application/vnd.android.package-archive apk; }
    add_header Content-Disposition 'attachment; filename="pagio.apk"' always;
    add_header Cache-Control "no-cache" always;
}

# Outils en ligne et connexion (menu « Outils en ligne » et « Se connecter ») : application web construite par
# « npm --prefix web run build », déposée dans /var/www/pagio/site/app. Mêmes comptes que l'application Android.
# Sécurité : seul le bouton « Continuer avec Google » est autorisé à charger un script extérieur.
location /app/ {
    root /var/www/pagio/site;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://accounts.google.com/gsi/client; style-src 'self' 'unsafe-inline' https://accounts.google.com/gsi/style; frame-src https://accounts.google.com/gsi/; connect-src 'self' https://accounts.google.com/gsi/; img-src 'self' data: blob: https://*.googleusercontent.com; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header Cache-Control "no-cache" always;
    try_files $uri $uri/ /app/index.html;
}
# Fichiers à empreinte : cache long ; pdf.js charge un module .mjs, servi comme du JavaScript.
location /app/assets/ {
    root /var/www/pagio/site;
    types { application/javascript js mjs; text/css css; }
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options nosniff always;
    try_files $uri =404;
}

# Site public (fichiers statiques).
location / {
    root /var/www/pagio/site;
    try_files $uri $uri/ =404;
}
