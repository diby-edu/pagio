# Application web Pagio (app.pagio.site) — bloc HTTPS, ajouté à /etc/nginx/sites-available/pagio sur le VPS.
# Fichiers statiques construits par « npm --prefix web run build » dans /var/www/pagio/app-web ; /api relayé vers Pagio
# (sans l'administration). Certificat : certbot certonly --webroot -w /var/www/html -d app.pagio.site
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name app.pagio.site;
    ssl_certificate /etc/letsencrypt/live/app.pagio.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.pagio.site/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    access_log /var/log/nginx/pagio-chrono.log pagio_chrono;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # Bouton « Continuer avec Google » : script et fenêtre de Google autorisés, rien d'autre d'extérieur.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://accounts.google.com/gsi/client; style-src 'self' 'unsafe-inline' https://accounts.google.com/gsi/style; frame-src https://accounts.google.com/gsi/; connect-src 'self' https://accounts.google.com/gsi/; img-src 'self' data: blob: https://*.googleusercontent.com; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    location ~* ^/api/+admin { return 404; }
    location /api/ { include /etc/nginx/snippets/pagio-proxy.conf; }

    root /var/www/pagio/app-web;
    # Fichiers à empreinte (assets/) : cache long. pdf.js charge un module .mjs, qui doit être servi comme du JavaScript.
    location /assets/ {
        types { application/javascript js mjs; text/css css; }
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }
    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;
    }
}
